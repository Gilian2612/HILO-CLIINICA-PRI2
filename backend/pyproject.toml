[project]
name = "hilo-clinico-backend"
version = "0.1.0"
description = "Capa de interoperabilidad Hilo Clínico: MPI, consentimiento, adaptadores FHIR R4, auditoría y motor del proceso BPMN."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "fhir.resources>=8.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
