  --ink: #3b365f;
  --ink-soft: #57537f;
  --sky: #f0f6ff;
  --cloud: #dae6f7;
  --mist: #f7faff;
  --paper: #ffffff;
  --line: #c9d6ec;
  --steel: #8196a6;
  --blue: #8aa3d0;
  --blue-deep: #44598f;
  --coral: #de917f;
  --coral-mid: #c8674f;
  --field: #7687b0;
  --coral-deep: #9c3e29;
  --coral-wash: #fcede8;
  --ok: #1c6e53;
  --ok-wash: #e2f3ea;
  --warn: #7d5110;
  --warn-wash: #fbf0da;
  --eps: #c27a1e;
  --ips: #5b6fd6;
  --lab: #1f9a7a;
  --display: 'Fraunces', Georgia, 'Times New Roman', serif;
  --body: 'Urbanist', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace;
  --shadow: 0 22px 44px -26px rgba(59, 54, 95, 0.42);
  --top-h: 66px;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--sky); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.45;
  font-feature-settings: 'ss01'; -webkit-font-smoothing: antialiased;
}
h1, h2, h3, h4, p, ul, ol, dl, dd, fieldset, legend { margin: 0; padding: 0; }
ul, ol { list-style: none; }
fieldset { border: 0; min-width: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
img { display: block; }
.mono { font-family: var(--mono); font-size: 0.82em; letter-spacing: -0.01em; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
:focus-visible { outline: 3px solid var(--ips); outline-offset: 2px; border-radius: 6px; }
.skip { position: absolute; left: 12px; top: -60px; background: var(--ink); color: #fff; padding: 10px 14px; border-radius: 10px; z-index: 50; }
.skip:focus { top: 10px; }

.display, h1, .visor-title, .patient-name, .rail-title, .p-hello { font-family: var(--display); font-variation-settings: 'SOFT' 100, 'WONK' 1, 'opsz' 96; font-weight: 700; letter-spacing: -0.015em; line-height: 1.08; }

/* ------------------------------------------------ botones y campos */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 10px 18px;
  border-radius: 999px; border: 1.5px solid transparent; font-weight: 700; font-size: 15px; line-height: 1.1;
  transition: background-color 0.16s ease, border-color 0.16s ease, transform 0.08s ease;
}
.btn:active { transform: translateY(1px); }
.btn-primary { background: var(--ink); color: #fff; }
.btn-primary:hover { background: #2c2849; }
.btn-primary:disabled { background: #a9a6c2; cursor: not-allowed; }
.btn-ghost { background: var(--paper); border-color: var(--line); color: var(--ink); }
.btn-ghost:hover { border-color: var(--ink-soft); }
.btn-danger { background: var(--paper); border-color: var(--coral); color: var(--coral-deep); }
.btn-danger:hover { background: var(--coral-wash); }
.btn-icon { padding: 10px; width: 44px; }
.link { display: inline-flex; align-items: center; gap: 6px; background: none; border: 0; padding: 6px 2px; color: var(--blue-deep); font-weight: 700; font-size: 14px; text-decoration: underline; text-underline-offset: 3px; }
.link:hover { color: var(--ink); }

.field { display: flex; flex-direction: column; gap: 6px; flex: 1; font-size: 14px; font-weight: 600; }
.field input, .field select, .field textarea {
  min-height: 46px; padding: 10px 14px; border: 1.5px solid var(--field); border-radius: 14px; background: var(--paper); font-size: 16px; font-weight: 500; width: 100%;
}
.field textarea { resize: vertical; line-height: 1.4; font-size: 14.5px; }
.field input:hover, .field select:hover, .field textarea:hover { border-color: var(--ink); }
.field input[aria-invalid='true'] { border-color: var(--coral-deep); }
.field-sm { flex: 0 0 150px; }
.field-row { display: flex; gap: 12px; }
.field-help { font-size: 14px; color: var(--ink-soft); }
.field-error { font-size: 14px; color: var(--coral-deep); font-weight: 600; }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: 14.5px; line-height: 1.35; cursor: pointer; padding: 6px 0; }
.check input { width: 20px; height: 20px; margin: 0; flex: none; accent-color: var(--ink); }

.badge { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; font-size: 13.5px; font-weight: 700; white-space: nowrap; }
.badge-ok { background: var(--ok-wash); color: var(--ok); }
.badge-warn { background: var(--warn-wash); color: var(--warn); }
.badge-lock { background: var(--cloud); color: var(--ink); }
.source-tag { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-soft); font-weight: 600; white-space: nowrap; }
.knot { flex: none; }

/* ------------------------------------------------ barra superior */
.top {
  height: var(--top-h); display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 24px; padding: 0 22px;
  background: var(--sky); border-bottom: 1.5px solid var(--line); position: sticky; top: 0; z-index: 20;
}
.brand { display: flex; align-items: baseline; gap: 12px; }
.wordmark { height: 26px; width: auto; color: var(--ink); display: block; }
.brand-tag { font-size: 13px; color: var(--ink-soft); font-weight: 600; }
.views { display: flex; gap: 4px; justify-self: center; }
.views button { position: relative; background: none; border: 0; padding: 12px 16px; min-height: 44px; font-weight: 600; font-size: 15px; color: var(--ink-soft); border-radius: 10px; }
.views button:hover { color: var(--ink); }
.views button.is-on { color: var(--ink); font-weight: 800; }
.views-line { position: absolute; left: 14px; right: 14px; bottom: 4px; height: 4px; border-radius: 4px; background: var(--coral-mid); }
.scenario { display: flex; align-items: center; gap: 4px; background: var(--paper); border: 1.5px solid var(--line); border-radius: 999px; padding: 3px; }
.scenario legend { float: left; font-size: 13px; font-weight: 700; color: var(--ink-soft); padding: 0 8px 0 12px; }
.scenario label { position: relative; padding: 8px 14px; min-height: 36px; border-radius: 999px; font-size: 14px; font-weight: 700; cursor: pointer; color: var(--ink-soft); display: inline-flex; align-items: center; transition: background-color 0.16s ease, color 0.16s ease; }
.scenario label:hover { color: var(--ink); }
.scenario label.is-on { background: var(--ink); color: #fff; }
.scenario input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.scenario label:has(input:focus-visible) { outline: 3px solid var(--ips); outline-offset: 2px; }

/* ------------------------------------------------ simulaci\xF3n */
.view-sim { display: grid; grid-template-columns: 272px minmax(0, 1fr); height: calc(100vh - var(--top-h)); min-height: 560px; }
.rail { display: flex; flex-direction: column; padding: 18px 16px 14px 20px; border-right: 1.5px solid var(--line); background: var(--mist); min-height: 0; overflow: hidden; }
.rail-title { font-size: 25px; }
.rail-sub { font-size: 14px; color: var(--ink-soft); margin: 4px 0 12px; }
.steps { position: relative; display: flex; flex-direction: column; gap: 1px; flex: 1 1 auto; min-height: 0; overflow-y: auto; margin: 0 -8px 0 -4px; padding: 2px 8px 8px 4px; }
.step:not(:last-child)::before { content: ''; position: absolute; left: 9px; top: 16px; bottom: -14px; width: 2.5px; border-radius: 2px; background: var(--line); }
.step-done:not(:last-child)::before { background: var(--ink); }
.step { position: relative; display: grid; grid-template-columns: 20px minmax(0, 1fr) auto; gap: 10px; padding: 6px 0; align-items: start; }
.step-knot { width: 20px; height: 20px; border-radius: 50%; background: var(--paper); border: 2.5px solid var(--line); display: grid; place-items: center; color: #fff; margin-top: 1px; z-index: 1; }
.step-done .step-knot { background: var(--ink); border-color: var(--ink); }

.step-actor { font-size: 12px; font-weight: 700; color: var(--ink-soft); padding: 2px 8px; border-radius: 999px; background: var(--cloud); white-space: nowrap; margin-top: 1px; }
.actor-hilo { background: var(--ink); color: #fff; }
.actor-paciente { background: var(--coral-wash); color: var(--coral-deep); }
.step-help { font-size: 13.5px; color: var(--ink); margin-top: 4px; line-height: 1.38; overflow: hidden; }

.controls { flex: none; margin-top: auto; padding-top: 12px; border-top: 1.5px solid var(--line); display: flex; flex-direction: column; gap: 10px; }
.controls-hint { font-size: 14px; font-weight: 600; min-height: 2.6em; line-height: 1.3; }
.controls-row { display: flex; gap: 8px; }
.controls-row .btn-primary { flex: 1; }
.controls-row { gap: 6px; }
.controls-row .btn-primary { white-space: nowrap; padding-left: 10px; padding-right: 10px; font-size: 14.5px; gap: 6px; }
.controls-row .btn-icon { flex: none; }
.controls-row .btn-icon:disabled { opacity: .4; cursor: not-allowed; }
.switch { display: flex; align-items: center; gap: 10px; font-size: 13.5px; color: var(--ink-soft); font-weight: 600; cursor: pointer; min-height: 32px; }
.switch input { position: absolute; opacity: 0; width: 44px; height: 26px; margin: 0; cursor: pointer; }
.switch-track { flex: none; width: 44px; height: 26px; border-radius: 26px; background: var(--line); position: relative; transition: background-color 0.16s ease; }
.switch-track::after { content: ''; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: transform 0.16s ease; box-shadow: 0 1px 3px rgba(59, 54, 95, 0.4); }
.switch input:checked + .switch-track { background: var(--ink); }
.switch input:checked + .switch-track::after { transform: translateX(18px); }
.switch input:focus-visible + .switch-track { outline: 3px solid var(--ips); outline-offset: 2px; }

.pane-switch { display: none; }
.stage { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) 328px; gap: 22px; padding: 16px 22px 16px 20px; min-height: 0; overflow: hidden; }
.deco { position: absolute; pointer-events: none; opacity: 0.8; }
.deco-1 { width: 96px; right: 318px; top: 4px; transform: rotate(-8deg); }
.stage-medico { display: flex; flex-direction: column; gap: 12px; min-height: 0; min-width: 0; z-index: 1; }
.stage-paciente { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; min-height: 0; }
.phone-blob { position: absolute; width: 150%; max-width: none; top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(74deg); pointer-events: none; }
.sources-key { display: flex; gap: 14px; font-size: 13px; font-weight: 700; color: var(--ink-soft); z-index: 1; }
.sources-key li { display: inline-flex; align-items: center; gap: 6px; }

/* visor */
.visor { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; background: var(--paper); border-radius: 24px; box-shadow: var(--shadow); overflow: hidden; border: 1.5px solid transparent; transition: border-color 0.2s ease; }
.visor.has-turn, .phone-wrap.has-turn .phone { border-color: var(--coral); }
.visor-bar { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 12px 20px; border-bottom: 1.5px solid var(--cloud); }
.visor-org { font-size: 13px; font-weight: 700; color: var(--ink-soft); }
.visor-title { font-size: 21px; }
.who { display: flex; align-items: center; gap: 10px; }
.who-text { display: flex; flex-direction: column; text-align: right; font-size: 13px; line-height: 1.25; color: var(--ink-soft); }
.who-text strong { color: var(--ink); font-size: 14px; }
.avatar { width: 44px; height: 44px; border-radius: 50%; overflow: hidden; background: var(--cloud); position: relative; flex: none; }
.avatar img { position: absolute; max-width: none; }
.avatar-medico img { width: 86px; left: -21px; top: 3px; }
.avatar-paciente img { width: 78px; left: -13px; top: 2px; }
.patient { display: flex; justify-content: space-between; align-items: center; gap: 14px; padding: 12px 20px; background: var(--mist); border-bottom: 1.5px solid var(--cloud); }
.patient-name { font-size: 24px; }
.patient-meta { font-size: 14.5px; color: var(--ink-soft); font-weight: 600; margin-top: 2px; }
.visor-body { flex: 1; min-height: 0; overflow-y: auto; position: relative; }

.search { max-width: 560px; margin: 0 auto; padding: 28px 24px; display: flex; flex-direction: column; gap: 12px; }
.search h3 { font-family: var(--display); font-variation-settings: 'SOFT' 100, 'WONK' 1, 'opsz' 96; font-size: 30px; font-weight: 700; letter-spacing: -0.015em; line-height: 1.1; }
.search-lead { color: var(--ink-soft); font-size: 15.5px; margin-bottom: 4px; }
.search .btn { align-self: flex-start; margin-top: 6px; }
.search .check { background: var(--mist); border: 1.5px solid var(--cloud); border-radius: 14px; padding: 12px 14px; }

.notice { max-width: 520px; margin: 0 auto; padding: 44px 24px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.notice h3 { font-family: var(--display); font-variation-settings: 'SOFT' 100, 'WONK' 1, 'opsz' 96; font-size: 27px; font-weight: 700; letter-spacing: -0.015em; line-height: 1.12; }
.notice p { color: var(--ink-soft); font-size: 15.5px; }
.notice-icon { width: 56px; height: 56px; border-radius: 50% 46% 52% 48% / 48% 54% 46% 52%; display: grid; place-items: center; background: var(--cloud); color: var(--ink); }
.notice-ok .notice-icon { background: var(--ok-wash); color: var(--ok); }
.notice-lock .notice-icon { background: var(--cloud); }
.notice-icon.is-busy { animation: breathe 1.2s ease-in-out infinite; }
.notice-actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 10px; }
@keyframes breathe { 50% { transform: scale(1.1); } }

.match, .fetch { padding: 24px 24px 28px; max-width: 760px; margin: 0 auto; }
.match-lead { font-family: var(--display); font-variation-settings: 'SOFT' 100, 'WONK' 1, 'opsz' 96; font-weight: 700; font-size: 24px; letter-spacing: -0.015em; margin-bottom: 16px; }
.match-grid { display: grid; grid-template-columns: minmax(0, 1.25fr) 120px minmax(0, 1fr); align-items: center; }
.match-sources { display: grid; grid-template-rows: repeat(3, 68px); }
.match-sources li { display: flex; gap: 12px; align-items: center; }
.match-sources div, .fetch-sources div, .p-sources div { display: flex; flex-direction: column; line-height: 1.25; min-width: 0; }
.match-sources strong { font-size: 15px; }
.match-sources span { font-size: 13.5px; color: var(--ink-soft); }
.match-thread { width: 100%; height: 204px; }
.match-one { background: var(--ink); color: #fff; border-radius: 22px 18px 24px 16px; padding: 16px 18px; display: flex; flex-direction: column; gap: 3px; }
.match-one-label { font-size: 12.5px; font-weight: 700; opacity: 0.8; }
.match-one strong { font-family: var(--display); font-variation-settings: 'SOFT' 100, 'WONK' 1, 'opsz' 96; font-size: 21px; line-height: 1.12; }
.match-one .mono { opacity: 0.8; }

.fetch-sources { display: flex; flex-direction: column; gap: 8px; }
.fetch-sources li { display: grid; grid-template-columns: 16px 1fr auto; gap: 12px; align-items: center; padding: 12px 16px; border: 1.5px solid var(--cloud); border-radius: 16px; background: var(--mist); }
.fetch-sources span { font-size: 13.5px; color: var(--ink-soft); }
.fetch-count { font-weight: 700; }
.fetch-sources li.is-done { border-color: var(--line); background: var(--paper); }
.fetch-sources li.is-done .fetch-count { color: var(--ink); }

.history { display: grid; grid-template-columns: minmax(0, 1fr) 258px; gap: 0; min-height: 100%; }
.history-main { padding: 16px 18px 20px 20px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.alert { display: grid; grid-template-columns: 24px 1fr auto; gap: 12px; align-items: center; background: var(--coral-wash); border: 1.5px solid var(--coral); border-radius: 18px 14px 20px 14px; padding: 9px 14px; color: var(--coral-deep); }
.alert div { display: flex; flex-direction: column; line-height: 1.3; }
.alert strong { font-size: 17px; }
.alert span { font-size: 13.5px; color: #6f2f20; }
.alert .link { color: var(--coral-deep); }
.no-repeat { display: flex; gap: 10px; align-items: center; background: var(--ok-wash); color: var(--ok); border-radius: 14px; padding: 10px 14px; font-size: 14.5px; }
.no-repeat span { color: #154f3c; }
.scope-note { display: flex; gap: 8px; align-items: center; font-size: 13.5px; color: var(--ink-soft); font-weight: 600; }

.thread { position: relative; display: flex; flex-direction: column; gap: 8px; padding-left: 30px; margin-top: 4px; }
.thread-line { position: absolute; left: 7px; top: 10px; bottom: 10px; width: 3px; border-radius: 3px; background: var(--ink); transform-origin: top; }
.event { position: relative; }
.event-knot { position: absolute; left: -30px; top: 15px; width: 17px; height: 17px; display: grid; place-items: center; background: var(--paper); border-radius: 50%; box-shadow: 0 0 0 3px var(--paper); }
.event-head { width: 100%; display: grid; grid-template-columns: minmax(0, 1fr) 20px; grid-template-areas: 'title chev' 'sub chev' 'meta chev'; column-gap: 12px; row-gap: 2px; align-items: center; text-align: left; background: var(--mist); border: 1.5px solid var(--cloud); border-radius: 16px; padding: 9px 12px 9px 14px; min-height: 52px; transition: border-color 0.16s ease, background-color 0.16s ease; }
.event-head:hover { border-color: var(--blue); }
.event.is-open .event-head { background: var(--paper); border-color: var(--line); border-radius: 16px 16px 0 0; }
.event-meta { grid-area: meta; display: flex; flex-wrap: wrap; align-items: center; column-gap: 5px; font-size: 13px; color: var(--ink-soft); font-weight: 600; }
.event-meta strong { color: var(--ink); }
.event-meta .source-tag { margin-left: 10px; }
.event-title { grid-area: title; display: flex; align-items: center; gap: 7px; font-weight: 700; font-size: 15px; min-width: 0; }
.event-sub { grid-area: sub; font-size: 13.5px; color: var(--ink-soft); }
.event-chev { grid-area: chev; transition: transform 0.18s ease; color: var(--ink-soft); }
.event.is-open .event-chev { transform: rotate(180deg); }
.event-body { overflow: hidden; border: 1.5px solid var(--line); border-top: 0; border-radius: 0 0 16px 16px; background: var(--paper); padding: 0 14px; }
.event-body > *:first-child { margin-top: 10px; }
.event-body > *:last-child { margin-bottom: 8px; }
.event-empty { font-size: 14.5px; color: var(--ink-soft); padding: 12px 0; }
.results { width: 100%; border-collapse: collapse; font-size: 14px; }
.results th, .results td { text-align: left; padding: 6px 8px 6px 0; border-bottom: 1px solid var(--cloud); font-weight: 500; }
.results thead th { font-size: 12.5px; color: var(--ink-soft); font-weight: 700; }
.results tbody th { font-weight: 600; }
.results tr.is-out td strong { color: var(--coral-deep); }
.flag { font-size: 12.5px; font-weight: 700; color: var(--coral-deep); background: var(--coral-wash); padding: 2px 8px; border-radius: 999px; }
.flag-ok { color: var(--ink-soft); background: var(--sky); }
.detail { display: grid; grid-template-columns: 96px 1fr; gap: 4px 12px; font-size: 14px; }
.detail dt { color: var(--ink-soft); font-weight: 700; font-size: 13px; }

.today { border-left: 1.5px solid var(--cloud); background: var(--mist); padding: 16px 16px 18px; display: flex; flex-direction: column; gap: 10px; }
.today h4 { font-family: var(--display); font-variation-settings: 'SOFT' 100, 'WONK' 1, 'opsz' 96; font-size: 19px; font-weight: 700; }
.today-meta { font-size: 13.5px; color: var(--ink-soft); font-weight: 600; }
.has-turn .btn-turn { animation: nudge 1.6s ease-in-out 3; }
@keyframes nudge { 0%, 100% { box-shadow: 0 0 0 0 rgba(222, 145, 127, 0); } 50% { box-shadow: 0 0 0 7px rgba(222, 145, 127, 0.55); } }

/* la capa por dentro */
.hood.is-closed { flex-basis: 47px; }
.hood-toggle { margin-left: 4px; }
.hood-toggle svg { transition: transform 0.18s ease; }
.hood.is-closed .hood-toggle svg { transform: rotate(180deg); }
.hood.is-closed .hood-tabs { border-bottom-color: transparent; padding-bottom: 6px; }
.hood { transition: flex-basis 0.22s ease; flex: 0 0 188px; display: flex; flex-direction: column; background: var(--ink); color: #e9ecfa; border-radius: 20px; overflow: hidden; min-height: 0; }
.hood-tabs { display: flex; align-items: center; gap: 2px; padding: 6px 10px 0 16px; border-bottom: 1px solid rgba(255, 255, 255, 0.16); }
.hood-title { font-family: var(--display); font-variation-settings: 'SOFT' 100, 'WONK' 1, 'opsz' 96; font-weight: 700; font-size: 16px; color: #fff; margin-right: auto; }
.hood-tabs button { background: none; border: 0; color: #c9cbe6; font-weight: 700; font-size: 13.5px; padding: 8px 12px 9px; min-height: 40px; border-bottom: 3px solid transparent; display: inline-flex; gap: 7px; align-items: center; }
.hood-tabs button:hover { color: #fff; }
.hood-tabs button.is-on { color: #fff; border-bottom-color: var(--coral); }
.hood-tabs :focus-visible, .hood-panel:focus-visible { outline-color: #fff; }
.count { background: rgba(255, 255, 255, 0.16); border-radius: 999px; padding: 1px 8px; font-size: 12px; }
.hood-panel { flex: 1; overflow: auto; padding: 8px 16px 10px; }
.hood-empty { color: #c9cbe6; font-size: 14px; padding: 14px 0; max-width: 60ch; }
.log { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.log th, .log td { text-align: left; padding: 5px 12px 5px 0; vertical-align: top; }
.log thead th { position: sticky; top: -8px; background: var(--ink); font-size: 12px; color: #b9bbdc; font-weight: 700; }
.log tbody tr { border-top: 1px solid rgba(255, 255, 255, 0.1); }
.log .source-tag { color: #e9ecfa; }
.log tr.is-denied td { color: #f3c1b6; }
.log .mono { white-space: nowrap; }
.log td.url { white-space: normal; overflow-wrap: anywhere; }
.log th:last-child, .log td:last-child { padding-right: 0; }
.pill { font-size: 12px; font-weight: 700; padding: 2px 9px; border-radius: 999px; white-space: nowrap; }
.pill-ok { background: rgba(125, 214, 176, 0.2); color: #a8e6cb; }
.pill-warn { background: rgba(245, 200, 110, 0.2); color: #f5d596; }
.pill-deny { background: rgba(240, 160, 140, 0.2); color: #f6c3b7; }
.json { margin: 0; font-size: 12.5px; line-height: 1.5; white-space: pre; color: #dfe3f8; }

/* tel\xE9fono */
.phone-wrap { position: relative; z-index: 1; height: min(100%, 616px); min-height: 0; display: flex; }
.phone { width: 296px; height: 100%; min-height: 440px; background: var(--mist); border: 9px solid var(--ink); border-radius: 42px; display: flex; flex-direction: column; overflow: hidden; box-shadow: var(--shadow); outline: 2px solid transparent; transition: border-color 0.2s ease; }
.phone-status { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 8px 20px 2px; font-size: 12px; font-weight: 700; }
.phone-status span:last-child { text-align: right; }
.phone-island { width: 64px; height: 18px; border-radius: 12px; background: var(--ink); }
.phone-head { display: flex; justify-content: space-between; align-items: center; padding: 8px 16px 10px; border-bottom: 1.5px solid var(--cloud); }
.phone-head .wordmark { height: 19px; }
.phone-head .avatar { width: 36px; height: 36px; }
.phone-head .avatar-paciente img { width: 64px; left: -11px; top: 2px; }
.phone-body { flex: 1; min-height: 0; overflow-y: auto; position: relative; }
.p-screen { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 10px; min-height: 100%; }
.p-hello { font-size: 25px; }
.p-lead { font-size: 14.5px; color: var(--ink-soft); line-height: 1.4; }
.p-sources { display: flex; flex-direction: column; gap: 6px; }
.p-sources li { display: flex; gap: 10px; align-items: center; background: var(--paper); border: 1.5px solid var(--cloud); border-radius: 14px; padding: 9px 12px; }
.p-sources strong { font-size: 14.5px; }
.p-sources span { font-size: 12.5px; color: var(--ink-soft); }
.p-empty { display: flex; gap: 10px; align-items: flex-start; font-size: 13.5px; color: var(--ink-soft); background: var(--sky); border-radius: 14px; padding: 12px; margin-top: auto; }
.p-empty svg { flex: none; margin-top: 2px; }
.p-state { display: flex; gap: 10px; align-items: center; border-radius: 16px 12px 18px 12px; padding: 12px 14px; }
.p-state div { display: flex; flex-direction: column; line-height: 1.25; }
.p-state strong { font-size: 15.5px; }
.p-state span { font-size: 13px; }
.p-state-ok { background: var(--ok-wash); color: var(--ok); }
.p-state-warn { background: var(--warn-wash); color: var(--warn); }
.p-state-lock { background: var(--cloud); color: var(--ink); }
.p-log h4 { font-size: 13.5px; font-weight: 700; margin-bottom: 4px; }
.p-log ul { display: flex; flex-direction: column; }
.p-log li { display: flex; justify-content: space-between; gap: 10px; font-size: 13.5px; padding: 7px 0; border-bottom: 1px solid var(--cloud); }
.p-log-time { color: var(--ink-soft); white-space: nowrap; }
.p-log-empty { font-size: 13.5px; color: var(--ink-soft); }
.p-screen > .btn { margin-top: auto; }
.p-request { background: var(--paper); min-height: 100%; }
.p-req-who { font-family: var(--display); font-variation-settings: 'SOFT' 100, 'WONK' 1, 'opsz' 96; font-size: 22px; font-weight: 600; line-height: 1.15; letter-spacing: -0.01em; }
.p-req-who strong { font-weight: 800; }
.p-req-where { font-size: 13.5px; color: var(--ink-soft); }
.p-scopes { display: flex; flex-direction: column; background: var(--mist); border: 1.5px solid var(--cloud); border-radius: 16px; padding: 10px 12px 6px; }
.p-scopes legend { font-size: 13.5px; font-weight: 700; padding: 0 4px; }
.p-scopes .check { min-height: 40px; align-items: center; font-size: 14px; padding: 4px 0; }
.p-actions { display: flex; flex-direction: column; gap: 8px; margin-top: auto; }

/* ------------------------------------------------ BPMN */
.view-bpmn, .view-impact { padding: 22px 26px 40px; max-width: 1560px; margin: 0 auto; }
.bpmn-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; margin-bottom: 12px; }
.bpmn-actions { display: flex; gap: 8px; flex: none; }
.view h1 { font-size: clamp(28px, 3vw, 40px); }
.view-bpmn h1 { font-size: clamp(26px, 2.5vw, 34px); }
.view-bpmn { padding-top: 14px; }
.bpmn-head p { color: var(--ink-soft); margin-top: 2px; max-width: 70ch; font-size: 15px; }
.bpmn-card { background: var(--paper); border-radius: 24px; box-shadow: var(--shadow); padding: 6px 8px; }
.bpmn-scroll { overflow-x: auto; }
.bpmn { display: block; width: 100%; min-width: 1080px; height: auto; font-family: var(--body); }
.bp-pool { fill: var(--paper); }
.bp-pool-band { fill: var(--cloud); }
.bp-pool-frame { fill: none; stroke: var(--ink); stroke-width: 1.6; }
.bp-pool-name { font-size: 12.5px; font-weight: 700; fill: var(--ink); }
.bp-lane { fill: var(--paper); }
.bp-lane-hilo { fill: var(--sky); }
.bp-lane-line { stroke: var(--ink); stroke-width: 1.2; fill: none; }
.bp-lane-name { font-size: 12px; font-weight: 700; fill: var(--ink); }
.bp-ext { fill: var(--mist); stroke: var(--ink); stroke-width: 1.4; }
.bp-ext-name { font-weight: 700; fill: var(--ink); }
.bp-flow path { fill: none; stroke: var(--steel); stroke-width: 1.6; stroke-linejoin: round; transition: stroke 0.25s ease; }
.bp-flow.is-taken path { stroke: var(--ink); stroke-width: 2.4; }
.bp-flow-name, .bp-gw-name, .bp-ev-name { font-size: 11px; font-weight: 700; fill: var(--ink-soft); }
.bp-gw-name { fill: var(--ink); font-size: 11.5px; }
.bp-msg path { fill: none; stroke: var(--ink-soft); stroke-width: 1.4; stroke-dasharray: 5 4; }
.bp-msg.is-active path { stroke: var(--coral-deep); stroke-width: 2; animation: dash 0.7s linear infinite; }
@keyframes dash { to { stroke-dashoffset: -18; } }
.bp-node { cursor: pointer; outline: none; }
.bp-shape { fill: var(--paper); stroke: var(--ink); stroke-width: 1.6; transition: fill 0.25s ease; }
.bp-end .bp-shape { stroke-width: 4; }
.bp-xor .bp-x { stroke: var(--ink); stroke-width: 2.4; stroke-linecap: round; }
.bp-label { font-weight: 600; fill: var(--ink); }
.bp-marker { fill: none; stroke: var(--ink); stroke-width: 1.1; stroke-linecap: round; }
.bp-marker-fill rect { fill: var(--ink); stroke: none; }
.bp-marker-env { stroke: var(--paper); fill: none; stroke-width: 1.1; }
.bp-node.is-done .bp-shape { fill: var(--cloud); }
.bp-node.is-current .bp-shape { fill: var(--ink); }
.bp-node.is-current .bp-label { fill: #fff; }
.bp-node.is-current .bp-marker { stroke: #fff; }
.bp-node.is-current .bp-marker-fill rect { fill: #fff; }
.bp-node.is-current .bp-marker-env { stroke: var(--ink); }
.bp-node.is-current.bp-xor .bp-x { stroke: #fff; }
.bp-node.is-current.bp-end .bp-shape, .bp-node.is-current.bp-start .bp-shape { fill: var(--paper); }
.bp-node:hover .bp-shape { stroke: var(--ips); }
.bp-node.is-selected .bp-shape, .bp-node:focus-visible .bp-shape { stroke: var(--ips); stroke-width: 3; }
.bp-ring { fill: none; stroke: var(--coral-deep); stroke-width: 2.5; pointer-events: none; }
.bp-token { fill: var(--coral-mid); stroke: var(--paper); stroke-width: 2.5; pointer-events: none; filter: drop-shadow(0 2px 3px rgba(59, 54, 95, 0.45)); }

.bpmn-foot { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 36px; margin-top: 14px; align-items: start; }
.now-kind { font-size: 13px; font-weight: 700; color: var(--ink-soft); }
.now h2 { font-family: var(--display); font-variation-settings: 'SOFT' 100, 'WONK' 1, 'opsz' 96; font-size: 24px; font-weight: 700; letter-spacing: -0.015em; margin: 2px 0; }
.now-meta { font-size: 14px; font-weight: 700; color: var(--ink-soft); }
.now-help { margin-top: 6px; max-width: 58ch; }
.legend h3 { font-size: 13px; font-weight: 700; color: var(--ink-soft); margin-bottom: 6px; }
.legend ul { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 16px; font-size: 14px; font-weight: 600; }
.legend li { display: flex; align-items: center; gap: 9px; }
.lg { flex: none; width: 26px; height: 18px; display: grid; place-items: center; }
.lg-task { border: 1.6px solid var(--ink); border-radius: 5px; background: var(--paper); }
.lg-gw { width: 15px; height: 15px; margin: 0 5.5px; border: 1.6px solid var(--ink); transform: rotate(45deg); background: var(--paper); }
.lg-start, .lg-end { width: 17px; height: 17px; margin: 0 4.5px; border-radius: 50%; border: 1.6px solid var(--ink); background: var(--paper); }
.lg-end { border-width: 4px; }
.lg-msg { height: 0; border-top: 2px dashed var(--ink-soft); }
.lg-token { width: 15px; height: 15px; margin: 0 5.5px; border-radius: 50%; background: var(--coral-mid); box-shadow: 0 0 0 2px var(--paper), 0 0 0 3px var(--line); }
.controls-compact { margin-top: 0; border-top: 0; padding-top: 0; }

/* ------------------------------------------------ impacto */
.impact-head { position: relative; display: grid; grid-template-columns: 1fr 150px; align-items: end; gap: 20px; padding: 26px 30px 0; overflow: hidden; border-radius: 28px; min-height: 190px; }
.impact-head > div { position: relative; padding-bottom: 26px; max-width: 60ch; }
.impact-head p { color: var(--ink-soft); margin: 8px 0 12px; }
.impact-blob { position: absolute; inset: -30% -6% auto -10%; width: 122%; max-width: none; height: 230%; object-fit: fill; }
.impact-figure { position: relative; width: 104px; justify-self: center; margin-bottom: -150px; }
.facts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); margin-top: 22px; background: var(--paper); border-radius: 24px; box-shadow: var(--shadow); }
.fact { padding: 18px 22px 20px; border-left: 1.5px solid var(--cloud); }
.fact:first-child { border-left: 0; }
.fact-n { font-family: var(--display); font-variation-settings: 'SOFT' 100, 'WONK' 1, 'opsz' 144; font-weight: 700; font-size: 54px; line-height: 1; }
.fact-label { font-weight: 700; font-size: 15.5px; line-height: 1.3; margin-top: 6px; }
.fact-detail { font-size: 14px; color: var(--ink-soft); margin-top: 4px; }
.compare { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; margin-top: 34px; }
.compare h2, .evidence h2, .ods h2 { font-family: var(--display); font-variation-settings: 'SOFT' 100, 'WONK' 1, 'opsz' 96; font-size: 25px; font-weight: 700; letter-spacing: -0.015em; margin-bottom: 12px; }
.compare ol { position: relative; display: flex; flex-direction: column; gap: 12px; padding-left: 30px; counter-reset: paso; }
.compare ol::before { content: ''; position: absolute; left: 7px; top: 8px; bottom: 8px; width: 3px; border-radius: 3px; }
.compare li { position: relative; max-width: 58ch; }
.compare li::before { content: ''; position: absolute; left: -30px; top: 3px; width: 17px; height: 17px; border-radius: 50%; }
.compare-asis ol::before { background: repeating-linear-gradient(var(--steel) 0 7px, transparent 7px 13px); }
.compare-asis li::before { background: var(--sky); border: 2.5px solid var(--steel); }
.compare-asis li { color: var(--ink-soft); }
.compare-tobe ol::before { background: var(--ink); }
.compare-tobe li::before { background: var(--coral-mid); box-shadow: 0 0 0 3px var(--sky); }
.compare-tobe li { font-weight: 600; }
.evidence { margin-top: 38px; }
.evidence-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 26px; }
.evidence article { border-top: 3px solid var(--ink); padding-top: 12px; display: flex; flex-direction: column; gap: 6px; }
.evidence h3 { font-size: 17px; font-weight: 800; line-height: 1.25; }
.evidence a { color: var(--blue-deep); font-weight: 700; font-size: 14px; text-underline-offset: 3px; margin-top: auto; padding: 6px 0; }
.evidence-note { margin-top: 14px; font-size: 14.5px; color: var(--ink-soft); max-width: 80ch; }
.ods { margin-top: 34px; }
.ods ul { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.ods li { background: var(--cloud); border-radius: 22px 16px 24px 16px; padding: 14px 18px; font-size: 15px; }
.ods strong { display: block; font-family: var(--display); font-variation-settings: 'SOFT' 100, 'WONK' 1, 'opsz' 96; font-size: 20px; }

/* ------------------------------------------------ adaptaci\xF3n */
@media (max-height: 760px) and (min-width: 1181px) {
  .hood { flex-basis: 158px; }
  .rail { padding-top: 14px; }
  .rail-sub { margin-bottom: 10px; }
}
@media (max-width: 1180px) {
  .top { grid-template-columns: 1fr auto; height: auto; padding: 10px 16px; row-gap: 6px; position: static; }
  .views { grid-column: 1 / -1; grid-row: 2; justify-self: start; }
  .brand-tag { display: none; }
  .view-sim { grid-template-columns: 1fr; height: auto; min-height: 0; }
  .rail { border-right: 0; border-bottom: 1.5px solid var(--line); padding: 12px 16px; overflow: visible; }
  .rail-title, .rail-sub { display: none; }
  .steps { margin: 0 0 8px; padding: 0; overflow: visible; }
  .step::before { display: none; }
  .step { display: none; }
  .step.step-current { display: grid; }
  .controls { border-top: 0; padding-top: 0; margin-top: 0; }
  .controls-hint { min-height: 0; }
  .stage { overflow: visible; padding: 14px 16px 28px; }
  .visor { min-height: 520px; }
  .phone-wrap { height: 616px; }
  .facts { grid-template-columns: 1fr 1fr; }
  .fact:nth-child(3) { border-left: 0; }
  .fact:nth-child(n + 3) { border-top: 1.5px solid var(--cloud); }
}
@media (max-width: 860px) {
  .scenario legend { display: none; }
  .scenario label { padding: 8px 10px; font-size: 13px; }
  .top { grid-template-columns: 1fr; }
  .pane-switch { display: flex; gap: 6px; padding: 10px 16px 0; }
  .pane-switch button { flex: 1; display: inline-flex; justify-content: center; align-items: center; gap: 8px; min-height: 44px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--paper); font-weight: 700; }
  .pane-switch button.is-on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .stage { grid-template-columns: 1fr; }
  .stage.pane-medico .stage-paciente, .stage.pane-paciente .stage-medico { display: none; }
  .deco { display: none; }
  .history { grid-template-columns: 1fr; }
  .today { border-left: 0; border-top: 1.5px solid var(--cloud); }
  .event-meta .source-tag { margin-left: 0; }
  .event-body { overflow-x: auto; }
  .hood-title { display: none; }
  .hood-tabs { overflow-x: auto; padding-left: 8px; }
  .hood-tabs button { white-space: nowrap; }
  .hood { flex-basis: 260px; }
  .match-grid { grid-template-columns: 1fr; gap: 12px; }
  .match-thread { display: none; }
  .field-row { flex-direction: column; }
  .field-sm { flex-basis: auto; }
  .patient, .visor-bar { flex-wrap: wrap; }
  .who-text { display: none; }
  .view-bpmn, .view-impact { padding: 16px 14px 32px; }
  .bpmn-head { flex-direction: column; align-items: flex-start; }
  .bpmn-actions { flex-wrap: wrap; }
